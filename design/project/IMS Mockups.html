<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>IMS — Hi-Fi Mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mockups/primitives.jsx"></script>
<script type="text/babel" src="mockups/dashboards.jsx"></script>
<script type="text/babel" src="mockups/timetable.jsx"></script>
<script type="text/babel" src="mockups/students.jsx"></script>
<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "showAnnotations": true,
  "showAdmin": true,
  "showStudent": true,
  "showTimetable": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAKS);
  const [editMode, setEditMode] = React.useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setEditMode(true);
      if (d.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setKey = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  return (
    <>
      <DesignCanvas>
        <div style={{ padding: '10px 60px 36px', maxWidth: 900 }}>
          <div style={{ fontSize: 11, letterSpacing: 2, color: '#888', marginBottom: 8, fontWeight: 500 }}>IMS · DASS A3 · HI-FI MOCKUPS · v1</div>
          <div style={{ fontSize: 38, fontWeight: 700, color: '#111', letterSpacing: -1.2, marginBottom: 12, lineHeight: 1.05 }}>
            Institute Management System
          </div>
          <div style={{ fontSize: 15, color: '#555', lineHeight: 1.55, maxWidth: 680 }}>
            Notion-style. Clean typography, document-like surfaces, soft subject pills, no decoration.
            10 screens · Admin + Student roles · Inter for UI, JetBrains Mono for IDs &amp; codes.
          </div>
          <div style={{ display: 'flex', gap: 22, marginTop: 22, fontSize: 12, color: '#666' }}>
            <span>▸ 390×844 device frames</span>
            <span>▸ Notion + Google Calendar + Raycast</span>
            <span>▸ drag-to-schedule timetable</span>
          </div>
        </div>

        {tweaks.showAdmin && (
          <DCSection title="Flow A · Admin — Home, Search, Directory" subtitle="D-01-A → D-02 → S-01 → S-01b → S-02">
            <AdminDashboard />
            <SearchOverlay />
            <StudentList />
            <FilterSheet />
            <StudentProfile />
          </DCSection>
        )}

        {tweaks.showTimetable && (
          <DCSection title="Flow B · Admin — Timetable authoring" subtitle="T-01 grid with multi-slot cells · drag from tray · tap cell for details · create/edit form">
            <TimetableAdmin />
            <SlotDetailSheet />
            <SlotEditModal />
            <ModuleStub />
          </DCSection>
        )}

        {tweaks.showStudent && (
          <DCSection title="Flow C · Student — Home" subtitle="D-01-S · contextual greeting, next-up card, classes, news. Profile re-uses S-02 read-only.">
            <StudentDashboard />
          </DCSection>
        )}

        {tweaks.showAnnotations && (
          <>
            <DCPostIt top={300} left={870} rotate={-2.5} width={200}>
              Raycast palette · grouped results · keyboard hints.
            </DCPostIt>
            <DCPostIt top={300} left={1780} rotate={2} width={210}>
              Active filter chips (Recognition &gt; Recall, Nielsen #6).
            </DCPostIt>
            <DCPostIt top={1260} left={480} rotate={-1.5} width={220}>
              Multiple subjects per slot = different rooms/batches at the same time. Color pills per subject.
            </DCPostIt>
            <DCPostIt top={1260} left={920} rotate={2} width={200}>
              Bottom sheet keeps grid visible behind scrim — no context loss.
            </DCPostIt>
            <DCPostIt top={1260} left={1780} rotate={-2} width={220}>
              Wed &amp; Sat 2–5pm locked as free (diagonal stripe).
            </DCPostIt>
          </>
        )}

        <div style={{ padding: '20px 60px 60px', maxWidth: 900, color: '#555', fontSize: 12, lineHeight: 1.7 }}>
          <div style={{ marginBottom: 10, letterSpacing: 2, fontWeight: 600, color: '#888' }}>USABILITY PRINCIPLES</div>
          <div>▸ <b>Visibility of system status</b> — conflict banners, filter counts, active-chip summary</div>
          <div>▸ <b>Recognition over recall</b> — all modules visible, search grouped by type, pre-filled forms</div>
          <div>▸ <b>Aesthetic &amp; minimalist</b> — rows show only essentials; detail one tap away</div>
        </div>
      </DesignCanvas>

      {editMode && (
        <div style={{
          position: 'fixed', bottom: 16, right: 16, zIndex: 100,
          background: '#fff', border: '1px solid #E3E2E0', borderRadius: 10,
          padding: 14, fontFamily: 'Inter, sans-serif', fontSize: 12,
          boxShadow: '0 10px 30px rgba(0,0,0,0.12)', width: 220,
        }}>
          <div style={{ fontWeight: 600, marginBottom: 10, fontSize: 11, color: '#787774', textTransform: 'uppercase', letterSpacing: 1 }}>Tweaks</div>
          {[
            ['showAnnotations', 'Post-it notes'],
            ['showAdmin', 'Admin flow'],
            ['showTimetable', 'Timetable flow'],
            ['showStudent', 'Student flow'],
          ].map(([k, lbl]) => (
            <label key={k} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '5px 0', cursor: 'pointer' }}>
              <input type="checkbox" checked={!!tweaks[k]} onChange={e => setKey(k, e.target.checked)} />
              <span>{lbl}</span>
            </label>
          ))}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
